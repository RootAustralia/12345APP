# .github/workflows/publish.yml — scheduled MSIX-to-release housekeeping (12345APP CI repo).
# Role in system: independent of the build.yml fan-out. Runs daily (and on manual/self-edit triggers) to pull
#   the latest Store-published MSIX for our app and mirror it onto the GitHub release of the PRIVATE APP12345 repo,
#   backfilling the Windows artifact that build-windows.yml only uploads as a fallback when Store publish fails.
# Key pieces: on.schedule (cron '0 0 * * *') + workflow_dispatch + push-on-self-edit; job upload-to-release uses
#   JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release keyed by PARTNER_STORE (store-id).
# Note: continue-on-error — a no-op day (no new Store package) must not fail the run; asset name uses PKCS12_NAME.

name: publish

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/publish.yml"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}

permissions:
  contents: write

jobs:
  upload-to-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ORG_TOKEN }}

      - name: Upload store MSIX to release
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        continue-on-error: true
        with:
          store-id: ${{ secrets.PARTNER_STORE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          asset-name-pattern: ${{ secrets.PKCS12_NAME }}_{version}_{arch}
