# .github/workflows/build-android.yml — reusable workflow: build + publish the Android app.
# Role in system: one of three fan-out targets called by build.yml (this 12345APP CI repo).
#   Checks out the PRIVATE APP12345 repo (which vendors the prebuilt librainbox.so ABIs),
#   builds a signed AAB + universal APK with Flutter, ships AAB -> Google Play and APK -> GitHub release.
# Key pieces: workflow_call inputs {name,pkg,version}; steps Set build environment (versionCode),
#   Setup Android signing, Build Android App Bundle and APK, Upload to Google Play Store, GitHub-release uploads.
# Note: secrets (PKCS12 keystore, Google service account) are decoded to disk on the runner — sensitive.
#   Play upload is continue-on-error; the AAB only lands on the GitHub release when Play upload FAILS,
#   whereas the APK is always attached to the release.
# 【中文】
# .github/workflows/build-android.yml —— 可复用工作流:构建并发布 Android 应用。
# 系统角色: build.yml(本 12345APP CI 仓库)扇出调用的三个目标工作流之一。
#   检出私有 APP12345 仓库(其中 vendored 提交了预编译的各 ABI librainbox.so),
#   用 Flutter 构建已签名的 AAB 与通用 APK:AAB 上传 Google Play,APK 附到 GitHub Release。
# 关键部分: workflow_call 输入 {name,pkg,version};步骤:Set build environment(推导 versionCode)、
#   Setup Android signing、Build Android App Bundle and APK、Upload to Google Play Store、GitHub Release 上传。
# 注意: 机密(PKCS12 密钥库、Google 服务账号)会被解码写到 runner 磁盘 —— 属敏感数据。
#   Play 上传为 continue-on-error;只有当 Play 上传「失败」时 AAB 才会附到 GitHub Release,
#   而 APK 则总是附到 Release。

name: build-android

# ── Section: Shared env & permissions ── GITHUB_TOKEN feeds the release-upload steps and
#    PRIVATE_REPO names the private repo to check out; contents:write lets this job create releases.
# 【中文】
# ── 本节:共享环境变量与权限 ── GITHUB_TOKEN 供 Release 上传步骤使用,PRIVATE_REPO 指明要
#    检出的私有仓库;contents:write 授权本任务创建 GitHub Release。
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}

permissions:
  contents: write

# ── Section: workflow_call trigger & inputs ── this is a REUSABLE workflow: build.yml invokes it,
#    passing the app display name, the Android package id, and the version string to build/publish.
# 【中文】
# ── 本节:workflow_call 触发器与输入 ── 这是「可复用工作流」:由 build.yml 调用,
#    传入应用显示名、Android 包名(pkg)以及要构建/发布的版本号。
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: 'App name'
      pkg:
        required: true
        type: string
        description: 'Package name'
      version:
        required: true
        type: string
        description: 'Version to build'

# ── Section: build-android-app job ── the single Ubuntu job that runs the whole Android
#    checkout → version → sign → build → publish pipeline, step by step below.
# 【中文】
# ── 本节:build-android-app 任务 ── 唯一的 Ubuntu 任务,依次完成整条
#    Android 检出 → 版本号 → 签名 → 构建 → 发布流水线。
jobs:
  build-android-app:
    runs-on: ubuntu-latest
    steps:
      # ── Section: Source checkout ── pulls the PRIVATE APP12345 repo (app source + the vendored
      #    prebuilt jniLibs/<abi>/librainbox.so binaries) using the cross-repo ORG_TOKEN.
      # 【中文】
      # ── 本节:源码检出 ── 用跨仓库的 ORG_TOKEN 检出私有 APP12345 仓库
      #    (应用源码 + vendored 预编译的 jniLibs/<abi>/librainbox.so)。
      - name: Checkout private repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ORG_TOKEN }}

      # ── Section: Toolchain setup ── JDK 17 (required by Gradle/AGP), stable-channel Flutter,
      #    and a pub-cache keyed on pubspec.lock so repeat builds skip dependency downloads.
      # 【中文】
      # ── 本节:工具链准备 ── 安装 JDK 17(Gradle/AGP 需要)与 stable 渠道 Flutter,
      #    并按 pubspec.lock 缓存 pub 依赖,让重复构建免于重新下载。
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ── Section: Versioning ── derives the monotonic Android versionCode from the semver tag
      #    (2.9.7 -> 297) and rewrites pubspec.yaml to X.Y.Z+BUILD so Flutter stamps
      #    versionName + versionCode into the artifacts.
      # 【中文】
      # ── 本节:版本号处理 ── 由语义化版本推导单调递增的 Android versionCode(如 2.9.7 -> 297),
      #    并把 pubspec.yaml 改写为 X.Y.Z+BUILD,让 Flutter 将 versionName + versionCode 写入产物。
      - name: Set build environment
        id: build-env
        run: |
          set -xeuo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          IFS='.' read -r a b c <<< "$VERSION"
          # Derive a monotonic Android versionCode from semver: e.g. 2.9.7 -> 297.
          BUILD_NUMBER=$((a * 100 + b * 10 + c))
          # Rewrite pubspec's `version:` to `X.Y.Z+BUILD` so Flutter stamps versionName+versionCode.
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      # ── Section: Dependency resolution ── fetches pub packages (after the pubspec rewrite above)
      #    and logs the Flutter version for build-log traceability.
      # 【中文】
      # ── 本节:依赖解析 ── 在上面改写 pubspec 之后拉取 pub 依赖包,
      #    并打印 Flutter 版本以便在构建日志中追溯。
      - name: Install Flutter dependencies
        run: |
          flutter pub get

      - name: Check Flutter version
        run: |
          flutter --version

      # ── Section: Release signing ── decodes the PKCS12 keystore from secrets onto disk and
      #    writes android/key.properties, which android/app/build.gradle.kts reads to sign the
      #    release AAB/APK. Sensitive material lives on the runner from here on.
      # 【中文】
      # ── 本节:发布签名 ── 从 secrets 解码 PKCS12 密钥库写入磁盘,并生成 android/key.properties,
      #    供 android/app/build.gradle.kts 读取以对 Release AAB/APK 签名。此后 runner 上存有敏感材料。
      - name: Setup Android signing
        run: |
          echo "${{ secrets.PKCS12_BASE64 }}" | base64 -d > android/app/${{ secrets.PKCS12_NAME }}-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.PKCS12_PASSWORD }}
          keyPassword=${{ secrets.PKCS12_PASSWORD }}
          keyAlias=${{ secrets.PKCS12_NAME }}
          storeFile=${{ secrets.PKCS12_NAME }}-keystore.jks
          EOF

      # ── Section: Flutter build ── regenerates l10n + launcher icons, then produces BOTH release
      #    artifacts (obfuscated, split debug info): the AAB destined for Google Play and a
      #    universal APK for the GitHub release; each is renamed to a versioned filename.
      # 【中文】
      # ── 本节:Flutter 构建 ── 先重新生成 l10n 与启动图标,再构建两个 Release 产物
      #    (启用混淆并拆分调试符号):送往 Google Play 的 AAB 和附到 GitHub Release 的
      #    通用 APK,并各自重命名为带版本号的文件名。
      - name: Build Android App Bundle and APK
        run: |
          set -xeuo pipefail
          echo "Building ${{ inputs.name }} ${{ inputs.version }} (Release Mode)"
          rm -rf .dart_tool android/.gradle
          flutter gen-l10n
          flutter pub run flutter_launcher_icons

          flutter build appbundle --release \
              --obfuscate \
              --split-debug-info=debug-info/android \
              --suppress-analytics \
              --no-tree-shake-icons
          mv build/app/outputs/bundle/release/app-release.aab \
             "${{ inputs.name }}-android-${{ inputs.version }}.aab"

          flutter build apk --release \
              --obfuscate \
              --split-debug-info=debug-info/android \
              --suppress-analytics \
              --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-release.apk \
             "${{ inputs.name }}-android-universal-${{ inputs.version }}.apk"

      # ── Section: Google Play publishing ── decodes the service-account JSON from secrets, then
      #    uploads the AAB to the production track. continue-on-error: a Play outage or rejection
      #    must not kill the release — the failure is caught by the fallback below.
      # 【中文】
      # ── 本节:Google Play 发布 ── 从 secrets 解码服务账号 JSON,再把 AAB 上传到 production
      #    轨道。设为 continue-on-error:即使 Play 故障或拒收也不中断发布 —— 失败由下方兜底步骤接住。
      - name: Decode Google Play service account
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > service-account.json

      - name: Upload to Google Play Store
        id: publish
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: ${{ inputs.pkg }}
          releaseFiles: ${{ inputs.name }}-android-${{ inputs.version }}.aab
          track: production
          status: completed

      # ── Section: GitHub-release uploads ── the universal APK is ALWAYS attached to the
      #    version-tagged release (direct-download channel); the AAB is attached only as a
      #    fallback when the Play upload above failed, so the artifact is never lost.
      # 【中文】
      # ── 本节:GitHub Release 上传 ── 通用 APK 总是附到以版本号打标的 Release(直接下载渠道);
      #    AAB 仅在上面的 Play 上传失败时作为兜底附上,确保产物不会丢失。
      - name: Upload APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ inputs.name }}-android-universal-${{ inputs.version }}.apk

      - name: Upload AAB to GitHub release (Play Store upload failed)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          files: ${{ inputs.name }}-android-${{ inputs.version }}.aab
